[project]
name = "lotteryml"
version = "0.0.0"
description = "Lottery number prediction pipeline"
requires-python = ">=3.14"
dependencies = [
    "lz4~=4.3",
    "numpy~=2.2",
    "scipy~=1.14",
    "scikit-learn>=1.5,<1.8",
    "joblib~=1.4",
    "colorlog~=6.9",
    "pytest-cov",
    "pandas",
    "gitpython",
    "pygithub",
    "python-dotenv",
    "pytest",
    "optuna",
]

[tool.uv]
package = false
